<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧸 ファーちゃんのオルゴール試作 | Atelier Cotton</title>
<style>
  :root{--ink:#5a4a6a;--sub:#9a86b8;--pink:#ffb3d9;--lav:#c9b0ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#fff5fa 0%,#f3edff 55%,#e8f4ff 100%);display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:rgba(255,255,255,.82);border:2px solid #fff;border-radius:26px;box-shadow:0 10px 34px rgba(155,124,240,.22);
    max-width:420px;width:100%;padding:28px 22px 20px;text-align:center;position:relative;overflow:hidden}
  .star{position:absolute;color:#ffd9ec;font-size:15px;animation:tw 2.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  h1{font-size:19px;margin:0 0 2px}
  .song{font-size:14px;color:var(--sub);margin:0 0 16px}
  .bear{font-size:74px;line-height:1.1;filter:drop-shadow(0 6px 10px rgba(155,124,240,.25))}
  .bear.playing{animation:bob 1.03s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
  #lyric{font-size:15px;font-weight:700;min-height:24px;margin:12px 0 4px;color:#7a5fa8}
  #sub{font-size:12px;color:var(--sub);min-height:18px;margin:0 0 14px}
  button{font-family:inherit;font-size:17px;font-weight:900;color:#fff;border:0;border-radius:999px;cursor:pointer;
    padding:14px 34px;background:linear-gradient(120deg,var(--pink),var(--lav));box-shadow:0 5px 16px rgba(201,176,255,.5)}
  button:active{transform:scale(.97)}
  .note{font-size:11.5px;color:var(--sub);line-height:1.7;text-align:left;margin:18px 0 0;background:rgba(255,255,255,.6);
    border:1.5px dashed #e3d5ff;border-radius:14px;padding:10px 12px}
  .note a{color:#7a5fa8}
</style>
</head>
<body>
<div class="card">
  <span class="star" style="top:12px;left:16px">⭐</span>
  <span class="star" style="top:20px;right:22px;animation-delay:.7s">✨</span>
  <span class="star" style="top:64px;left:30px;animation-delay:1.3s">⭐</span>
  <span class="star" style="top:58px;right:38px;animation-delay:1.9s">✨</span>
  <h1>🧸 ファーちゃんのオルゴール</h1>
  <p class="song">「シャイニングスター」サビ・オルゴールアレンジ試作</p>
  <div class="bear" id="bear">🧸</div>
  <p id="lyric">♪ ボタンを押すと流れます ♪</p>
  <p id="sub">音符データだけで鳴らすので、読み込みは一瞬です</p>
  <button id="btn">▶ ながす</button>
  <div class="note">
    ※ これは試作です。メロディは公式音源の解析と公開されているコード進行（耳コピ）をもとに再構成したもので、原曲と違う音があると思います。気づいたら教えてください、直します。<br>
    音楽：魔王魂「シャイニングスター」（作詞・作曲：森田交一／唄：詩歩）の改変（オルゴール・アレンジ）<br>
    <a href="https://maou.audio/" target="_blank" rel="noopener">魔王魂 公式サイト</a>
  </div>
</div>
<script>
"use strict";
// ===== オルゴール試作: シャイニングスター(魔王魂) サビ =====
// キー: C major / BPM 116 / コード進行は公開耳コピ転記(C F G G#dim Am / F Em Am Bb G)に基づく
const BPM = 116, BEAT = 60 / BPM;
const N = {C3:48,"C#3":49,D3:50,"D#3":51,E3:52,F3:53,"F#3":54,G3:55,"G#3":56,A3:57,"A#3":58,B3:59,
  C4:60,"C#4":61,D4:62,"D#4":63,E4:64,F4:65,"F#4":66,G4:67,"G#4":68,A4:69,"A#4":70,B4:71,
  C5:72,"C#5":73,D5:74,"D#5":75,E5:76,F5:77};
const f = m => 440 * Math.pow(2, (m - 69) / 12);
// [bar, chord, [root,third,fifth] for arpeggio, bass]
const BARS = [
  ["C",    ["C4","E4","G4"], "C3"],
  ["C",    ["C4","E4","G4"], "C3"],
  ["F",    ["F4","A4","C5"], "F3"],
  ["G",    ["G4","B4","D5"], "G3"],
  ["G#dim",["G#4","B4","D5"],"G#3"],
  ["Am",   ["A4","C5","E5"], "A3"],
  ["F",    ["F4","A4","C5"], "F3"],
  ["Em",   ["E4","G4","B4"], "E3"],
  ["Am",   ["A4","C5","E5"], "A3"],
  ["Bb",   ["A#4","D5","F5"], "A#3"],
  ["G",    ["G4","B4","D5"], "G3"],
  ["C",    ["C4","E4","G4"], "C3"],
];
// メロディ: [bar(0始まり), 拍(0-3, 0.5刻み), 長さ(拍), 音名]
const MEL = [
  [0,0,.5,"E4"],[0,.5,.5,"G4"],[0,1,.5,"A4"],[0,1.5,.5,"G4"],[0,2,1,"E4"],[0,3,1,"G4"],
  [1,0,2,"A4"],[1,2,.5,"G4"],[1,2.5,.5,"F4"],[1,3,1,"E4"],
  [2,0,.5,"F4"],[2,.5,.5,"A4"],[2,1,.5,"G4"],[2,1.5,.5,"F4"],[2,2,2,"E4"],
  [3,0,.5,"D4"],[3,.5,.5,"E4"],[3,1,.5,"F4"],[3,1.5,.5,"G4"],[3,2,2,"A4"],
  [4,0,.5,"B4"],[4,.5,.5,"A4"],[4,1,.5,"G#4"],[4,1.5,.5,"A4"],[4,2,2,"C5"],
  [5,0,.5,"B4"],[5,.5,.5,"A4"],[5,1,.5,"G4"],[5,1.5,.5,"E4"],[5,2,2,"A4"],
  [6,0,.5,"A4"],[6,.5,.5,"C5"],[6,1,.5,"A4"],[6,1.5,.5,"F4"],[6,2,2,"A4"],
  [7,0,.5,"B4"],[7,.5,.5,"D5"],[7,1,.5,"C5"],[7,1.5,.5,"B4"],[7,2,2,"G4"],
  [8,0,.5,"A4"],[8,.5,.5,"C5"],[8,1,.5,"B4"],[8,1.5,.5,"A4"],[8,2,2,"E4"],
  [9,0,.5,"D5"],[9,.5,.5,"C5"],[9,1,.5,"A#4"],[9,1.5,.5,"A4"],[9,2,2,"F4"],
  [10,0,.5,"B4"],[10,.5,.5,"D5"],[10,1,.5,"B4"],[10,1.5,.5,"G4"],[10,2,2,"B4"],
  [11,0,3,"C5"],
];
const LYRICS = [
  [0,"シャイニングスター 綴れば"],[3,"夢に眠る幻が"],[6,"掌に降り注ぐ"],[9,"新たな世界へ"],
];
let ctx = null, playing = false, timers = [], runId = 0;
function bell(freq, t, vol, dur) {
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), o3 = ctx.createOscillator();
  const g1 = ctx.createGain(), g2 = ctx.createGain(), g3 = ctx.createGain();
  o1.type = "sine"; o1.frequency.value = freq;
  o2.type = "sine"; o2.frequency.value = freq * 2;
  o3.type = "sine"; o3.frequency.value = freq * 3.98;
  const d = dur || 1.6;
  g1.gain.setValueAtTime(0, t); g1.gain.linearRampToValueAtTime(vol, t + 0.004);
  g1.gain.exponentialRampToValueAtTime(0.0001, t + d);
  g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(vol * 0.28, t + 0.003);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + d * 0.45);
  g3.gain.setValueAtTime(0, t); g3.gain.linearRampToValueAtTime(vol * 0.13, t + 0.002);
  g3.gain.exponentialRampToValueAtTime(0.0001, t + d * 0.22);
  o1.connect(g1).connect(master); o2.connect(g2).connect(master); o3.connect(g3).connect(master);
  [o1, o2, o3].forEach(o => { o.start(t); o.stop(t + d + 0.1); });
}
let master;
function setup() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0.9;
  const dly = ctx.createDelay(1); dly.delayTime.value = 0.27;
  const fb = ctx.createGain(); fb.gain.value = 0.22;
  const wet = ctx.createGain(); wet.gain.value = 0.16;
  master.connect(ctx.destination); master.connect(dly); dly.connect(fb).connect(dly); dly.connect(wet).connect(ctx.destination);
}
function play() {
  if (!ctx) setup();
  if (ctx.state === "suspended") ctx.resume();
  const id = ++runId; playing = true;
  document.getElementById("btn").textContent = "⏹ とめる";
  document.getElementById("bear").classList.add("playing");
  document.getElementById("sub").textContent = "オルゴール演奏中… ♪";
  const t0 = ctx.currentTime + 0.08;
  BARS.forEach(([ch, tones, bass], i) => {
    const bt = t0 + i * 4 * BEAT;
    bell(f(N[bass]), bt, 0.20, 2.2);
    tones.forEach((tn, k) => { bell(f(N[tn]), bt + k * BEAT, 0.055, 1.1); });
    bell(f(N[tones[1]]), bt + 3 * BEAT, 0.045, 1.1);
  });
  MEL.forEach(([bar, beat, len, nm]) => {
    bell(f(N[nm]), t0 + (bar * 4 + beat) * BEAT, 0.30, Math.max(1.4, len * BEAT * 1.15));
  });
  LYRICS.forEach(([bar, text]) => {
    timers.push(setTimeout(() => { if (runId === id) document.getElementById("lyric").textContent = "♪ " + text + " ♪"; }, (bar * 4 * BEAT + 0.08) * 1000));
  });
  const total = BARS.length * 4 * BEAT;
  timers.push(setTimeout(() => { if (runId === id) stop(); }, (total + 1.6) * 1000));
}
function stop() {
  runId++; playing = false; timers.forEach(clearTimeout); timers = [];
  if (ctx) ctx.close().catch(() => {}); ctx = null;
  document.getElementById("btn").textContent = "▶ もう一度ながす";
  document.getElementById("bear").classList.remove("playing");
  document.getElementById("lyric").textContent = "♪ おしまい ♪";
  document.getElementById("sub").textContent = "どうだった？ 音が違うところがあったら教えてね";
}
document.getElementById("btn").onclick = () => { playing ? stop() : play(); };
</script>
</body>
</html>
