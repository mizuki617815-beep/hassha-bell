name: 占いデータ取得
on:
  schedule:
    - cron: "23 15 * * *"   # 毎日 0:23(日本時間)
    - cron: "23 0 * * *"    # 毎日 9:23(日本時間)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_fortune.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fortune.json
          git diff --cached --quiet || (git commit -m "占いデータ更新" && git push)
