name: 京急ダイヤ改正チェック
on:
  schedule:
    - cron: "17 1 * * 1"   # 毎週月曜 10:17(日本時間)
    - cron: "17 1 * * 4"   # 毎週木曜 10:17(日本時間)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: python3 scripts/check_dia.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dia-check.json
          git diff --cached --quiet || (git commit -m "ダイヤ改正チェック" && git pull --rebase -q && git push)
