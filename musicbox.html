const btn = document.getElementById('playBtn');
const lyricEl = document.getElementById('lyric');
const barEl = document.getElementById('bar');
const loopChk = document.getElementById('loopChk');
function freq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function strike(t, m, g, dest){
  const f = freq(m);
  const gn = ctx.createGain();
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
  gn.connect(dest);
  [[1, 1.0], [3.98, 0.32], [9.1, 0.07]].forEach(([h, a]) => {
    const o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = f * h;
    const og = ctx.createGain(); og.gain.value = a;
    o.connect(og); og.connect(gn);
    o.start(t); o.stop(t + 1.8);
  });
}
function start(){
  stop(true);
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = 0.9;
  const delay = ctx.createDelay(1.0); delay.delayTime.value = 0.27;
  const fb = ctx.createGain(); fb.gain.value = 0.22;
  const wet = ctx.createGain(); wet.gain.value = 0.16;
  master.connect(ctx.destination);
  master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ctx.destination);
  const t0 = ctx.currentTime + 0.08;
  NOTES.forEach(n => strike(t0 + n.t, n.m, n.g, master));
  startedAt = t0; playing = true; btn.textContent = '⏹';

    const el = ctx.currentTime - startedAt;
    if (el >= DUR){
      if (loopChk.checked){ start(); return; }
      stop(); return;
    }
    barEl.style.width = (el / DUR * 100) + '%';
    let cur = '♪';
    for (const p of PHRASES){ if (el >= p.t) cur = p.text; }
    lyricEl.textContent = cur;
  }, 120);
}
function stop(silent){
  if (timer){ clearInterval(timer); timer = null; }
  if (ctx){ ctx.close(); ctx = null; }
  playing = false; btn.textContent = '▶';
  if (!silent){ lyricEl.textContent = '♪'; barEl.style.width = '0%'; }
}
btn.addEventListener('click', () => { playing ? stop() : start(); });
